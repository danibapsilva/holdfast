name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # into .venv, where pyright is configured to look (pyproject.toml), like a local checkout
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Never mainnet
        run: python scripts/check_mainnet.py
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Contract compiles and its ABI is current
        run: python scripts/compile_contract.py --check
      - name: Types
        run: pyright
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # the gitleaks binary itself over every commit (the gitleaks action can't scan a repo's first push)
      - name: Scan the whole history for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
